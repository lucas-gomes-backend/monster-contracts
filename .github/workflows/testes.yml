name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Portão (verify.ps1)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      # Arquivos do Git LFS (imagens), menos o MonsterContracts.zip da raiz: a versão para
      # testar não serve aos testes e gastaria a cota de download do LFS a cada execução.
      - name: Baixar os arquivos do LFS
        run: git lfs pull --exclude="MonsterContracts.zip"

      - name: Baixar o Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          echo "GODOT_BIN=$PWD/godot" >> "$GITHUB_ENV"

      - name: Rodar o portão
        shell: pwsh
        run: ./tools/verify.ps1
