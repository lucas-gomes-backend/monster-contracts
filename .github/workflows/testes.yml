name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes (portão de 95%)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Importar o projeto
        run: ./godot --headless --path game --import || true

      - name: Rodar os testes
        run: ./godot --headless --path game -s res://tests/run_tests.gd -- --gate=0.95
